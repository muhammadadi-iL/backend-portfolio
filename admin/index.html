<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Muhammad Adil</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/admin/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="page-admin">
<section class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-brand">
      <img class="gate-favicon" src="/admin/mark.svg" alt="" width="36" height="36">
      <p class="brand-name">Muhammad Adil</p>
      <p class="brand-role">Senior Backend Developer</p>
    </div>
    <form id="login">
      <h1>Sign in</h1>
      <p class="gate-lead">Enter the admin password.</p>
      <div class="gate-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="Password" aria-label="Password">
        <button class="gate-reveal" id="toggle-password" type="button" aria-pressed="false" aria-label="Show password">
          <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
          <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
        </button>
      </div>
      <p class="inbox-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary gate-submit" type="submit">Sign in</button>
    </form>
    <p id="unavailable" hidden>This page is not available.</p>
  </div>
</section>
<main class="inbox" id="app" hidden>
  <aside class="side">
    <div class="side-team">
      <img src="/admin/mark.svg" alt="" width="20" height="20">
      <span>Muhammad Adil</span>
    </div>
    <nav class="dash-nav" aria-label="Dashboard">
      <button type="button" data-view="overview"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Overview</button>
      <button type="button" data-view="activity"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Activity</button>
      <button type="button" data-view="visits"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12.5 6 8l2.5 2.5L14 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Visits</button>
      <button type="button" data-view="ips"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 8h10M8 2.8c1.4 1.5 2.1 3.3 2.1 5.2S9.4 11.7 8 13.2C6.6 11.7 5.9 9.9 5.9 8S6.6 4.3 8 2.8z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>IP addresses</button>
      <button type="button" data-view="locations"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14s4.2-3.4 4.2-6.4A4.2 4.2 0 0 0 8 3.4a4.2 4.2 0 0 0-4.2 4.2C3.8 10.6 8 14 8 14z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="7.5" r="1.3" fill="currentColor"/></svg>Locations</button>
      <button type="button" data-view="chats"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10v7H6.2L3 13V3.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Chats</button>
    </nav>
  </aside>
  <div class="main-col">
    <div class="inbox-top">
      <div class="inbox-brand">
        <div>
          <p class="eyebrow">Admin</p>
          <h1 id="dash-title">Overview</h1>
          <p id="inbox-lead">Visits, IP addresses, locations and saved chats.</p>
        </div>
      </div>
      <div class="inbox-actions">
        <button class="btn icon-btn" id="refresh" type="button" hidden aria-label="Refresh"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8A5.2 5.2 0 1 1 11.6 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13.4 2.4v2.8h-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="btn" id="signout" type="button" hidden>Sign out</button>
      </div>
    </div>
    <div id="board" hidden>
      <div class="dash-tools">
        <div class="dash-search-wrap">
          <input class="dash-search" id="dash-search" type="search" placeholder="Search page, IP, location, name, email" autocomplete="off">
          <button class="dash-clear" id="dash-clear" type="button" hidden>Clear</button>
        </div>
        <p class="dash-count" id="dash-count"></p>
      </div>
      <div id="dash-view"></div>
    </div>
  </div>
</main>
<noscript><p class="inbox">JavaScript is required to open this page.</p></noscript>
<script src="/js/admin.js"></script>
</body>
</html>
